services:
  postgres:
    image: postgres:16-alpine
    container_name: kyb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kyb
      POSTGRES_PASSWORD: kyb
      POSTGRES_DB: kyb
    ports:
      - "5432:5432"
    volumes:
      - kyb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyb -d kyb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kyb-pgdata:
